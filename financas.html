<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanças da Casa</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6b73">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Layout: barra inferior no celular, abas no computador. Paleta: verde-petróleo sobre creme. */
:root{
  --bg:#f8f7f2; --surface:#ffffff; --surface-2:#f1efe8; --line:#e4e1d8;
  --text:#262c36; --muted:#687080; --accent:#1f6b73; --accent-soft:#ddeef0;
  --pos:#2e8a57; --pos-soft:#e2f3e8;
  --danger:#c23b2e; --danger-soft:#fbe7e3; --warn:#a9761a; --warn-soft:#fbf0d6;
  --p0:#3a6fb5; --p0-soft:#e3ecf8; --p1:#c0447e; --p1-soft:#f9e6ef;
  --casal:#2d8a8f; --casal-soft:#def0f0;
  --radius:16px; --shadow:0 1px 2px rgba(30,40,55,.05),0 6px 20px -10px rgba(30,40,55,.14);
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161a20; --surface:#1d222a; --surface-2:#262b34; --line:#2e343e;
    --text:#eceae4; --muted:#9aa1ad; --accent:#6cc3c6; --accent-soft:#22393b;
    --pos:#63c98a; --pos-soft:#1f3a2a;
    --danger:#ee8b7b; --danger-soft:#3e2420; --warn:#e8c060; --warn-soft:#3a3018;
    --p0:#8fb3ec; --p0-soft:#22304a; --p1:#ef93bf; --p1-soft:#42243a;
    --casal:#79c9cc; --casal-soft:#203a3b; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161a20; --surface:#1d222a; --surface-2:#262b34; --line:#2e343e;
  --text:#eceae4; --muted:#9aa1ad; --accent:#6cc3c6; --accent-soft:#22393b;
  --pos:#63c98a; --pos-soft:#1f3a2a;
  --danger:#ee8b7b; --danger-soft:#3e2420; --warn:#e8c060; --warn-soft:#3a3018;
  --p0:#8fb3ec; --p0-soft:#22304a; --p1:#ef93bf; --p1-soft:#42243a;
  --casal:#79c9cc; --casal-soft:#203a3b; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 80px}
header .wrap{padding-bottom:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 8px}
.brand{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em}
#arqStatus{font-size:12.5px;padding:6px 10px;white-space:nowrap}
#arqStatus.ok{color:var(--accent);border-color:var(--accent)}
#arqStatus.warn{color:var(--warn);border-color:var(--warn)}
@media (max-width:640px){.top{flex-wrap:wrap}.top>div:nth-child(2){order:3;width:100%}#arqStatus{flex:1}}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.mes{display:flex;align-items:center;gap:4px}
.mes b{min-width:132px;text-align:center;font-size:15px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:7px 13px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:10px;font-size:14px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0f1a14}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0f1a14}}
.btn.danger{color:var(--danger)}
.icon{border:0;background:transparent;color:var(--muted);width:34px;height:34px;border-radius:9px;font-size:17px;display:inline-grid;place-items:center}
.icon:hover{background:var(--surface-2);color:var(--text)}
section{display:none;padding-top:16px}
section.on{display:block}
h2{font-family:var(--display);font-size:17px;color:var(--text);font-weight:600;letter-spacing:-.01em;margin:24px 0 10px}
h2:first-child{margin-top:4px}
.row-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.row-head h2{margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(4,1fr)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi .lbl{font-size:12.5px;color:var(--muted)}
.kpi .val{font-family:var(--display);white-space:nowrap;font-size:clamp(17px,4.6vw,22px);font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.pos{color:var(--pos)} .neg{color:var(--danger)}
.two{grid-template-columns:1fr 1fr}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.meta{margin-top:12px}
.bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--danger)}
.alert{padding:12px 14px;border-radius:12px;font-size:14px;margin-top:12px}
.alert.bad{background:var(--danger-soft);color:var(--danger)}
.alert.ok{background:var(--pos-soft);color:var(--pos)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .v{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .acts{display:flex;gap:0}
.item.done .t,.item.done .v{color:var(--muted);text-decoration:line-through}
.item.late .s .due{color:var(--danger);font-weight:600}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.tag.p0{background:var(--p0-soft);color:var(--p0)}
.tag.p1{background:var(--p1-soft);color:var(--p1)}
.tag.Casal{background:var(--casal-soft);color:var(--casal)}
.tag.prev{background:var(--warn-soft);color:var(--warn)}
input[type=checkbox].chk{width:22px;height:22px;accent-color:var(--accent);flex:none;cursor:pointer}
.pessoa{border-left:4px solid var(--line)}
.pessoa h3{margin:0 0 8px;font-size:16px}
.linha{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;font-variant-numeric:tabular-nums}
.linha span:first-child{color:var(--muted)}
.linha.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700}
.linha.tot span:first-child{color:var(--text)}
.cat{display:grid;grid-template-columns:120px 1fr 96px;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.cat .bar{height:8px}
.cat span:last-child{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:480px){.cat{grid-template-columns:96px 1fr 84px}}
.cc{margin-bottom:14px}
.cc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cc-head h3{margin:0;font-size:17px}
.cc-total{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px}
dialog{max-height:calc(100dvh - 32px);overflow:auto;border:1px solid var(--line);border-radius:18px;padding:0;background:var(--surface);color:var(--text);width:min(460px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog form{padding:18px}
dialog h3{margin:0 0 14px;font-size:18px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);width:100%}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.field .hint{font-size:12px;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fields .full{grid-column:1/-1}
.dlg-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.dlg2-texto{white-space:pre-line;font-size:15px;margin:0 0 12px}
#dlg2 textarea{width:100%;min-height:140px;font:13px/1.4 ui-monospace,monospace;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:9px;font-size:13.5px}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.kpi .lbl{display:flex;align-items:center;gap:8px}
.ico{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;flex:none}
.ico svg{width:16px;height:16px}
.ico.pos{background:var(--pos-soft);color:var(--pos)} .ico.neg{background:var(--danger-soft);color:var(--danger)}
.ico.acc{background:var(--accent-soft);color:var(--accent)}
.sub .pos,.sub .warn-t{font-weight:600} .warn-t{color:var(--warn)}
/* contas para pagar */
.item.conta .dia{width:38px;text-align:center;flex:none;line-height:1.1}
.item.conta .dia b{display:block;font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}
.item.conta .dia span{font-size:10.5px;color:var(--muted);text-transform:uppercase}
.item.conta.late{background:var(--danger-soft)}
.item.conta.late .dia b,.item.conta.late .v{color:var(--danger)}
.st{font-size:11.5px;font-weight:600}
.st.late{color:var(--danger)} .st.logo{color:var(--warn)} .st.pago{color:var(--pos)}
/* cartão de cada pessoa */
.pessoa{border-left:1px solid var(--line)}
.pessoa .pc-top{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:10px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}
.p0 .av{background:var(--p0-soft);color:var(--p0)} .p1 .av{background:var(--p1-soft);color:var(--p1)}
.pessoa .pc-nome{flex:1;min-width:0} .pessoa .pc-nome b{display:block;font-size:16px} .pessoa .pc-nome span{font-size:12px;color:var(--muted)}
.pessoa .pc-saldo{font-family:var(--display);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pc-stats div{min-width:0} .pc-stats span{display:block;font-size:11.5px;color:var(--muted)} .pc-stats b{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
/* fatura */
.fat{background:var(--accent-soft);border-radius:14px;padding:12px;margin:12px 0}
.fat-per{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:10px 12px}
.fat-per svg{width:20px;height:20px;color:var(--accent);flex:none}
.fat-per p{margin:0;flex:1;font-size:14px;line-height:1.35;font-variant-numeric:tabular-nums}
.fat-tot{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.fat-tot .lbl{font-size:13px;color:var(--muted)}
/* barra inferior (celular) */
.bnav{display:none}
@media (max-width:760px){
  .tabs{display:none}
  .wrap{padding-bottom:110px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-right,0px))}
  .bnav button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font:500 11px var(--font)}
  .bnav button svg{width:22px;height:22px}
  .bnav button.on{color:var(--accent);font-weight:700}
  .bnav .fab{width:56px;height:56px;margin:-22px auto 8px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(31,107,115,.6);border:4px solid var(--bg);padding:0}
  .bnav .fab svg{width:26px;height:26px}
  #toast{bottom:100px}
}
.mais-list .item{cursor:pointer}
.mais-list .item svg{width:22px;height:22px;color:var(--accent)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.cfg p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.cfg .acts{display:flex;gap:8px;flex-wrap:wrap}
.proj{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:640px){.proj{grid-template-columns:repeat(3,1fr)}}
.proj div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.proj b{display:block;font-variant-numeric:tabular-nums;font-size:14px}
.proj span{font-size:12px;color:var(--muted);text-transform:capitalize}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">Finanças<small id="brandSub">controle do casal</small></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn small" data-acao="buscar" title="Procurar em todos os meses (atalho: Ctrl+K)">🔎 Buscar</button><button class="btn small" id="arqStatus" data-acao="arquivo" title="Onde os dados estão salvos"></button></div>
      <div class="mes">
        <button class="icon" id="prev" aria-label="Mês anterior">‹</button>
        <b id="mesLabel"></b>
        <button class="icon" id="next" aria-label="Próximo mês">›</button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" data-tab="resumo" aria-selected="true">Resumo</button>
      <button class="tab" data-tab="entradas">Entradas</button>
      <button class="tab" data-tab="gastos">Gastos do mês</button>
      <button class="tab" data-tab="fixos">Gastos fixos</button>
      <button class="tab" data-tab="cartoes">Cartões</button>
      <button class="tab" data-tab="config">Ajustes</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="resumo" class="on"></section>
  <section id="entradas"></section>
  <section id="gastos"></section>
  <section id="fixos"></section>
  <section id="cartoes"></section>
  <section id="config"></section>
  <section id="mais"></section>
</main>
<nav class="bnav" aria-label="Navegação">
  <button data-tab="resumo" data-ic="casa">Resumo</button>
  <button data-tab="cartoes" data-ic="cartao">Cartões</button>
  <button class="fab" data-acao="novoGasto" aria-label="Lançar gasto" data-ic="mais"></button>
  <button data-tab="gastos" data-ic="recibo">Gastos</button>
  <button data-tab="mais" data-ic="menu">Mais</button>
</nav>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h3 id="dlgTitulo"></h3>
    <div class="fields" id="dlgCampos"></div>
    <div id="dlgInfo" class="alert ok" style="display:none;margin:0 0 12px"></div>
    <div class="dlg-acts">
      <button type="button" class="btn" id="dlgCancel">Cancelar</button>
      <button type="submit" class="btn primary" id="dlgSalvar">Salvar</button>
    </div>
  </form>
</dialog>
<dialog id="dlg2"><form method="dialog" id="dlg2Form">
  <h3 id="dlg2Titulo"></h3>
  <div id="dlg2Texto" class="dlg2-texto"></div>
  <div id="dlg2Extra"></div>
  <div class="dlg-acts"><button type="button" class="btn" id="dlg2Nao">Cancelar</button><button type="submit" class="btn primary" id="dlg2Sim">Confirmar</button></div>
</form></dialog>
<div id="toast"></div>
<input type="file" id="importFile" hidden>
<input type="file" id="importCompras" hidden>
<input type="file" id="juntarFile" hidden>

<script>
/* ============ Dados ============ */
const KEY = 'financas-v1';
// Os nomes das pessoas ficam só nos dados do aparelho (nunca no código publicado).
let PESSOAS = ['Pessoa 1', 'Pessoa 2'];
let RESP = [...PESSOAS, 'Casal'];
const CATEGORIAS = ['Moradia', 'Contas da casa', 'Mercado', 'Alimentação fora', 'Transporte', 'Saúde', 'Impostos (DAS/MEI/INSS)', 'Juros e tarifas', 'Trabalho', 'Educação', 'Assinaturas', 'Lazer', 'Compras', 'Pets', 'Outros'];
const TIPOS_ENTRADA = ['Salário', 'Serviço / Freela', 'Pró-labore', 'Cliente fixo', 'Venda', 'Reembolso', 'Outros'];
const FORMAS = { pix: 'Pix', boleto: 'Boleto', debito: 'Débito', dinheiro: 'Dinheiro' };
const VAZIO = () => ({ receitas: [], entradasFixas: [], puladas: {}, fixos: [], cartoes: [], compras: [], gastos: [], pagos: {}, ajustes: {}, reserva: 0, divisao: '50', pctA: 50, pessoas: null });

let db = carregar();
let mes = hojeYM();
let aba = 'resumo';

function carregar() {
  try {
    let s = localStorage.getItem(KEY);
    if (!s) { // dados de uma versão antiga, guardados com outro nome
      const antiga = Object.keys(localStorage).find(k => { if (k === KEY || !k.startsWith('financas-')) return false; try { return Array.isArray(JSON.parse(localStorage.getItem(k)).receitas); } catch (e) { return false; } });
      if (antiga) { s = localStorage.getItem(antiga); localStorage.setItem(KEY, s); localStorage.removeItem(antiga); }
    }
    if (s) return Object.assign(VAZIO(), JSON.parse(s));
  } catch (e) {}
  return VAZIO();
}
// Descobre os nomes a partir dos próprios lançamentos (dados antigos) e guarda nos dados.
function prepararPessoas() {
  for (const k of Object.keys(db)) if (/^pct/.test(k) && k !== 'pctA') { if (db.pctA == null || db.pctA === 50) db.pctA = db[k]; delete db[k]; }
  if (!Array.isArray(db.pessoas) || db.pessoas.length !== 2) {
    const vistos = [];
    const ver = n => { if (n && n !== 'Casal' && !vistos.includes(n)) vistos.push(n); };
    db.receitas.forEach(r => ver(r.pessoa)); db.cartoes.forEach(c => ver(c.titular));
    [...db.fixos, ...db.compras, ...db.gastos].forEach(x => ver(x.pessoa));
    // só guarda quando achou nomes de verdade nos lançamentos; senão usa "Pessoa 1/2" provisoriamente
    if (vistos.length) db.pessoas = [vistos[0], vistos[1] || 'Pessoa 2'];
  }
  PESSOAS = db.pessoas ? [...db.pessoas] : ['Pessoa 1', 'Pessoa 2']; RESP = [...PESSOAS, 'Casal'];
  const sub = document.getElementById('brandSub'); if (sub) sub.textContent = `${PESSOAS[0]} & ${PESSOAS[1]}`;
}
function renomearPessoa(i, novo) {
  novo = String(novo || '').trim(); const velho = PESSOAS[i];

  else { b.className = 'btn small warn'; b.textContent = '💾 Salvar num arquivo do PC'; }
}

  if (!temFS) { aba = 'config'; render(); return toast(celular ? 'Os dados ficam guardados só neste celular' : 'Os dados ficam guardados neste navegador'); }
  try {
    if (arq && !arqPronto) {
      if (await arq.requestPermission({ mode: 'readwrite' }) !== 'granted') return;
      arqPronto = true; await lerArquivo(arq); statusArquivo(); render(); toast('Conectado a ' + arq.name); return;

  try {

      [h] = await window.showOpenFilePicker({ types: TIPO_JSON });
      let conteudo = null; try { conteudo = lerJSON(await (await h.getFile()).text()); } catch {}

      if (!await lerArquivo(h)) return toast('Esse arquivo não é das finanças');

      if (await h.queryPermission({ mode: 'readwrite' }) === 'granted') { arqPronto = true; await lerArquivo(h); render(); }

  }
  return { [A]: .5, [B]: .5 };
}
function porPessoa(ym) {
  const f = fatiaCasal(ym), res = {};
  for (const p of PESSOAS) res[p] = { entradas: 0, proprios: 0, casal: 0 };
  for (const r of entradasDoMes(ym)) if (res[r.pessoa]) res[r.pessoa].entradas += r.valor;
  for (const s of saidasDoMes(ym)) {
    if (s.pessoa === 'Casal') for (const p of PESSOAS) res[p].casal += s.valor * f[p];
    else if (res[s.pessoa]) res[s.pessoa].proprios += s.valor;
  }
  return { res, f };
}
const comprometido = ym => r2(previsaoDiaADia(ym) + soma(fixosAtivos(ym)) + soma(db.cartoes, c => soma(itensFatura(c.id, ym).filter(i => i.tipo === 'compra'))));

function rResumo() {
  const ent = entradasDoMes(mes);
  const recebido = soma(ent.filter(r => r.status !== 'previsto'));
  const aReceber = soma(ent.filter(r => r.status === 'previsto'));
  const saidas = saidasDoMes(mes);
  const totSaidas = r2(soma(saidas));
  const saldo = r2(recebido + aReceber - totSaidas);
  const contas = contasDoMes(mes);
  const aPagar = r2(soma(contas.filter(c => !c.pago)));
  const falta = r2(totSaidas - recebido - aReceber);

  // média de entradas dos últimos 3 meses (com algum lançamento)
  const ult = [1, 2, 3].map(k => soma(entradasDoMes(addM(mes, -k)))).filter(v => v > 0);
  const media = ult.length ? soma(ult, x => x) / ult.length : 0;
  const custoBase = totSaidas || comprometido(mes);
  const mesesReserva = custoBase > 0 ? db.reserva / custoBase : 0;

  const cobertura = totSaidas > 0 ? Math.min(100, (recebido + aReceber) / totSaidas * 100) : 100;
  let alerta;
  if (totSaidas === 0 && recebido + aReceber === 0) alerta = `<div class="alert warn">Comece cadastrando os <b>gastos fixos</b>, os <b>cartões</b> e as <b>entradas</b> do mês — o resumo se monta sozinho.</div>`;
  else if (falta > 0) alerta = `<div class="alert bad">Falta <b>${brl(falta)}</b> de entradas para fechar ${nomeMes(mes).split(' ')[0]}. ${media ? `A média dos últimos meses foi ${brl(media)}.` : ''}</div>`;
  else alerta = `<div class="alert ok">Mês coberto! Sobram <b>${brl(saldo)}</b>${aReceber ? ` (contando ${brl(aReceber)} ainda a receber)` : ''}. Que tal mandar uma parte para a reserva?</div>`;

  const { res, f } = porPessoa(mes);
  const cardPessoa = p => {
    const r = res[p], gasto = r.proprios + r.casal, s = r.entradas - gasto;
    return `<div class="card pessoa ${classePessoa(p)}">
      <div class="pc-top"><span class="av">${esc(String(p).trim().charAt(0).toUpperCase())}</span><div class="pc-nome"><b>${esc(p)}</b><span>saldo do mês</span></div><span class="pc-saldo ${s < 0 ? 'neg' : 'pos'}">${brl(s)}</span></div>
      <div class="pc-stats"><div><span>Entradas</span><b>${brl(r.entradas)}</b></div><div><span>Gastos próprios</span><b>${brl(r.proprios)}</b></div><div><span>Parte do casal (${Math.round(f[p] * 100)}%)</span><b>${brl(r.casal)}</b></div></div></div>`;
  };

  // categorias
  const cats = {};
  for (const s of saidas) cats[s.categoria || 'Outros'] = (cats[s.categoria || 'Outros'] || 0) + s.valor;
  const catArr = Object.entries(cats).sort((a, b) => b[1] - a[1]);
  const maxCat = catArr.length ? catArr[0][1] : 1;

  const hoje = new Date(), ehMesAtual = mes === hojeYM();
  const contasHtml = contas.length ? contas.map(c => {
    const atrasado = !c.pago && (difM(mes, hojeYM()) < 0 || (ehMesAtual && c.dia < hoje.getDate()));
    const logo = !c.pago && !atrasado && ehMesAtual && c.dia - hoje.getDate() <= 3;
    const st = c.pago ? '<span class="st pago">Pago</span>' : atrasado ? '<span class="st late">Atrasada</span>' : logo ? '<span class="st logo">Vence logo</span>' : '';
    return `<div class="item conta ${c.pago ? 'done' : ''} ${atrasado ? 'late' : ''}">
      <input type="checkbox" class="chk" data-pagar="${c.chave}" ${c.pago ? 'checked' : ''} aria-label="Marcar ${esc(c.nome)} como pago">
      <div class="dia"><b>${pad(c.dia)}</b><span>${nomeMes(mes, true)}</span></div>
      <div class="main"><div class="t">${esc(c.nome)}</div><div class="s">${tag(c.pessoa)} ${st} <span>${esc(c.info)}</span></div></div>
      <div class="v">${brl(c.valor)}</div></div>`;
  }).join('') : `<div class="empty">Nenhuma conta neste mês.</div>`;

  const proj = [1, 2, 3, 4, 5, 6].map(k => { const m = addM(mes, k), ent = soma(entradasDoMes(m)), sai = comprometido(m), sobra = r2(ent - sai);
    return `<div><span>${nomeMes(m, true)}</span><b>${brl(sai)}</b>${ent ? `<small class="${sobra < 0 ? 'neg' : 'pos'}" style="display:block;font-size:11.5px">${sobra < 0 ? 'faltam' : 'sobram'} ${brl(Math.abs(sobra))}</small>` : ''}</div>`; }).join('');

  $('#resumo').innerHTML = `
    <div class="grid kpis">
      <div class="card kpi"><div class="lbl"><span class="ico pos">${ic('entra')}</span>Entradas</div><div class="val">${brl(recebido + aReceber)}</div><div class="sub"><span class="pos">${brl(recebido)}</span> recebido${aReceber ? `<br><span class="warn-t">${brl(aReceber)}</span> a receber` : ''}</div></div>
      <div class="card kpi"><div class="lbl"><span class="ico neg">${ic('sai')}</span>Saídas</div><div class="val">${brl(totSaidas)}</div><div class="sub">${brl(aPagar)} ainda a pagar${previsaoDiaADia(mes) > 0 ? `<br><span class="warn-t">${brl(previsaoDiaADia(mes))}</span> previstos do dia a dia` : ''}</div></div>
      <div class="card kpi"><div class="lbl"><span class="ico ${saldo < 0 ? 'neg' : 'pos'}">${ic('carteira')}</span>Saldo previsto</div><div class="val ${saldo < 0 ? 'neg' : 'pos'}">${brl(saldo)}</div><div class="sub">entradas − saídas</div></div>
      <div class="card kpi"><div class="lbl"><span class="ico acc">${ic('cofre')}</span>Reserva</div><div class="val">${brl(db.reserva)}</div><div class="sub">${custoBase ? `cobre ${mesesReserva.toLocaleString('pt-BR', { maximumFractionDigits: 1 })} ${mesesReserva >= 0.95 && mesesReserva < 1.05 ? 'mês' : 'meses'} de gastos` : 'defina em Ajustes'}</div></div>
    </div>
    <div class="card meta">
      <div class="linha" style="padding-bottom:8px"><span>Quanto das saídas do mês já está coberto pelas entradas</span><b>${Math.round(cobertura)}%</b></div>
      <div class="bar ${cobertura < 60 ? 'bad' : cobertura < 100 ? 'warn' : ''}"><i style="width:${cobertura}%"></i></div>
      ${alerta}
    </div>

    <h2>Cada um</h2>
    <div class="grid two">${PESSOAS.map(cardPessoa).join('')}</div>

    <div class="row-head"><h2>Contas para pagar</h2><span class="small muted">${contas.filter(c => c.pago).length}/${contas.length} pagas</span></div>
    <div class="list">${contasHtml}</div>

    <h2>Para onde foi o dinheiro</h2>
    <div class="card">${catArr.length ? catArr.map(([c, v]) => `<div class="cat"><span>${esc(c)}</span><div class="bar"><i style="width:${v / maxCat * 100}%"></i></div><span>${brl(v)}</span></div>`).join('') : '<div class="empty">Sem gastos neste mês ainda.</div>'}</div>

    <h2>Próximos meses</h2>
    <div class="card"><p class="small muted" style="margin:0 0 10px">Em cima: o que deve sair (gastos fixos + parcelas já lançadas + a previsão do dia a dia). Embaixo: quanto sobra ou falta das entradas de todo mês.</p><div class="proj">${proj}</div></div>
  `;
}

function upsert(col, v) {
  if (!v.id) v.id = uid();
  const i = db[col].findIndex(x => x.id === v.id);
  if (i >= 0) db[col][i] = { ...db[col][i], ...v }; else db[col].push(v);
}

function campoHtml(c, val) {
  const id = 'f_' + c.n, req = c.req === false ? '' : 'required';
  let input;
  if (c.t === 'select') input = `<select id="${id}" name="${c.n}">${c.o.map(o => `<option value="${esc(o.v)}" ${String(val) === String(o.v) ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select>`;
  else if (c.t === 'valor') input = `<input id="${id}" name="${c.n}" inputmode="decimal" placeholder="0,00" value="${esc(valorTxt(val))}" ${req} autocomplete="off">`;
  else input = `<input id="${id}" name="${c.n}" type="${c.t}" value="${esc(val ?? '')}" ${c.min ? `min="${c.min}"` : ''} ${c.max ? `max="${c.max}"` : ''} ${c.ph ? `placeholder="${esc(c.ph)}"` : ''} ${req}>`;
  return `<div class="field ${c.full ? 'full' : ''}" data-campo="${c.n}"><label for="${id}">${c.l}</label>${input}${c.hint ? `<span class="hint">${c.hint}</span>` : ''}</div>`;
}

let formAtual = null;
/* ---------- Busca em todos os meses ---------- */
const semAcento = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const mesCurto = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('pt-BR', { month: 'short', year: 'numeric' }).replace('. de ', '/').replace('.', '').replace(' de ', '/'); };
function buscarTudo(q) {
  q = semAcento(q).trim();
  const qNum = lerValor(q);
  if (!q) return [];
  const bate = (desc, valor) => semAcento(desc).includes(q) || (!isNaN(qNum) && /\d/.test(q) && Math.abs(Number(valor) - qNum) < 0.005);
  const res = [];
  for (const c of db.compras) if (bate(c.descricao, c.valor)) {
    const cart = cartaoPor(c.cartaoId), p = Number(c.parcelas) || 1;
    const ini = cart ? mesPrimeiraParcela(c, cart) : ymDe(c.data), fim = addM(ini, p - 1);
    res.push({ x: c, col: 'compras', ir: ini, aba: 'cartoes', onde: `${nomeForma(c.cartaoId)} · ${p > 1 ? `${p}x de ${brl(valorParcela(c, 0))} · faturas de ${mesCurto(ini)} até ${mesCurto(fim)}` : `fatura de ${mesCurto(ini)}`}` });
  }
  for (const g of db.gastos) if (bate(g.descricao, g.valor)) res.push({ x: g, col: 'gastos', ir: ymDe(g.data), aba: 'gastos', onde: `${nomeForma(g.forma)} · Gastos do mês de ${mesCurto(ymDe(g.data))}` });
  for (const r of db.receitas) if (bate(r.descricao || r.tipo, r.valor)) res.push({ x: { ...r, descricao: r.descricao || r.tipo }, col: 'receitas', ir: ymDe(r.data), aba: 'entradas', onde: `Entrada de ${r.pessoa} · ${mesCurto(ymDe(r.data))}` });
  for (const f of db.fixos) if (bate(f.nome, f.valor)) res.push({ x: { ...f, descricao: f.nome, data: f.inicio + '-' + pad(f.dia || 1) }, col: 'fixos', ir: mes >= f.inicio ? mes : f.inicio, aba: 'fixos', onde: `Gasto fixo · desde ${mesCurto(f.inicio)}${f.fim ? ' até ' + mesCurto(f.fim) : ''}` });
  return res.sort((a, b) => b.x.data.localeCompare(a.x.data));
}
function desenharBusca() {
  const q = $('#buscaTxt').value, res = buscarTudo(q);
  $('#buscaRes').innerHTML = !q.trim() ? '<div class="empty">Digite parte do nome (ex.: farm, padaria) ou um valor (ex.: 54,60).</div>'
    : !res.length ? `<div class="empty">Nada encontrado com “${esc(q)}” em nenhum mês.</div>`
    : `<div class="small muted" style="margin:0 0 8px">${res.length} resultado${res.length > 1 ? 's' : ''} · clique para abrir o mês certo</div><div class="list" style="box-shadow:none">` + res.map((r, k) => `
      <div class="item" data-ir="${k}" style="cursor:pointer">
        <div class="main"><div class="t">${esc(r.x.descricao)}</div><div class="s">${r.col === 'fixos' ? 'dia ' + r.x.dia : dataBR(r.x.data) + '/' + r.x.data.slice(2, 4)} · ${esc(r.onde)} ${tag(r.x.pessoa)}</div></div>

function sincronizarFatura(e) {
  const ff = $('#f_faturaMes'); if (!ff) return;

  if (editouFatura && ff.value) return;

function sincronizarParcelas(e) {
  sincronizarFatura(e);

  if (!fp || !ft || !fn) { info.style.display = 'none'; return; }

  else if (e?.target !== fp) { const vt = lerValor(ft.value); if (!isNaN(vt) && vt > 0) fp.value = valorTxt(Math.floor(Math.round(vt * 100) / n) / 100); }
  const total = lerValor(ft.value);

  const parc = i => valorParcela({ valor: total, parcelas: n }, i);
  const atual = Math.min(n, parseInt($('#f_parcelaAtual')?.value) || 1);
  let falta = 0; for (let i = atual; i < n; i++) falta += parc(i);

/* ============ Janelas do próprio app (o navegador às vezes bloqueia alert/confirm) ============ */
let janelaVez = 0;
function janela({ titulo, texto, sim = 'Confirmar', nao = 'Cancelar', extra = '' }) {
  return new Promise(res => {
    const d = $('#dlg2');
    $('#dlg2Titulo').textContent = titulo || ''; $('#dlg2Texto').textContent = texto || '';
    $('#dlg2Extra').innerHTML = extra; $('#dlg2Sim').textContent = sim;
    $('#dlg2Nao').textContent = nao || ''; $('#dlg2Nao').hidden = !nao;
    const vez = ++janelaVez; // ignora o "fechou" atrasado de uma janela anterior
    let feito = false; const fim = v => { if (feito) return; feito = true; if (d.open) d.close(); res(v); };
    $('#dlg2Form').onsubmit = e => { e.preventDefault(); fim(true); };
    $('#dlg2Nao').onclick = () => fim(false);
    d.oncancel = e => { e.preventDefault(); if (vez === janelaVez) fim(false); }; // tecla Esc / voltar
    d.showModal(); setTimeout(() => ($('#dlg2Extra input, #dlg2Extra textarea') || $('#dlg2Sim')).focus(), 30);
  });
}
const confirmar = (texto, sim = 'Confirmar', titulo = 'Confirmar') => janela({ titulo, texto, sim });
const avisar = (texto, titulo = 'Aviso') => janela({ titulo, texto, sim: 'OK', nao: '' });

  return ok ? $('#dlg2Input').value : null;
}

// Soma compras de um arquivo { cartoes:[{nome,fechamento,vencimento}], compras:[{cartao,data,descricao,valor|valorParcela,parcelas,parcelaNaFatura,fatura,categoria,pessoa}] }
const lerJSON = t => JSON.parse(String(t).replace(/^\uFEFF/, ''));
const ehArquivoDeFaturas = d => d && Array.isArray(d.compras) && !Array.isArray(d.receitas) && d.compras.some(c => c.cartao);

  if (Array.isArray(d.receitas)) return avisar('Esse é um arquivo completo de dados (backup), não um arquivo de faturas. Para ele, use "Juntar com outro aparelho" ou "Substituir por um backup".');
  importarFaturas(d);
};
async function importarFaturas(d) {
  const acharCartao = nome => db.cartoes.find(c => semAcento(c.nome).trim() === semAcento(nome).trim());
  const faltando = [...new Set(d.compras.map(c => c.cartao).filter(n => !acharCartao(n)))];
  if (faltando.length) return avisar(`Cadastre primeiro o cartão: ${faltando.join(', ')} (aba Cartões) e tente de novo.`);
  const ajustes = (d.cartoes || []).map(c => { const a = acharCartao(c.nome); return { c: a, n: a && { fechamento: c.fechamento ?? a.fechamento, vencimento: c.vencimento ?? a.vencimento } }; })
    .filter(x => x.c && (Number(x.c.fechamento) !== Number(x.n.fechamento) || Number(x.c.vencimento) !== Number(x.n.vencimento)));
  const novas = [], repetidas = [];
  const existentes = new Set(db.compras.map(chaveCompra));
  for (const x of d.compras) {
    const cart = acharCartao(x.cartao), n = Math.max(1, parseInt(x.parcelas) || 1);
    const valor = x.valorParcela ? r2(x.valorParcela * n) : r2(x.valor);
    const c = { id: uid(), cartaoId: cart.id, data: x.data, descricao: x.descricao, valor, parcelas: n, categoria: x.categoria || 'Outros', pessoa: x.pessoa || cart.titular };
    if (x.fatura) c.primeiraParcela = addM(x.fatura, -((parseInt(x.parcelaNaFatura) || 1) - 1));
    (existentes.has(chaveCompra(c)) ? repetidas : novas).push(c);
  }
  const msg = `${novas.length} compra(s) nova(s) para adicionar.` + (repetidas.length ? `\n${repetidas.length} já estavam lançadas e serão puladas.` : '') +
    (ajustes.length ? `\n\nTambém vou corrigir: ${ajustes.map(a => `${a.c.nome} → fecha dia ${a.n.fechamento}, vence dia ${a.n.vencimento}`).join('; ')}.` : '') + '\n\nAdicionar?';
  if (!await confirmar(msg.replace(/\n*Adicionar\?$/, ''), 'Adicionar', 'Adicionar faturas')) return;
  for (const a of ajustes) { a.c.fechamento = Number(a.n.fechamento); a.c.vencimento = Number(a.n.vencimento); }
  db.compras.push(...novas);
  salvar(); aba = 'cartoes'; render(); toast(`${novas.length} compra(s) adicionada(s)`);
}

/* ---------- Juntar dados de outro aparelho (soma, não apaga) ---------- */
function juntarDados(outro) {
  const novos = {};
  if (!db.pessoas && Array.isArray(outro.pessoas) && outro.pessoas.length === 2) db.pessoas = [...outro.pessoas];
  for (const col of ['receitas', 'entradasFixas', 'fixos', 'cartoes', 'compras', 'gastos']) {
    const ids = new Set(db[col].map(x => x.id));
    const chaveRec = r => `${r.data}|${r.pessoa}|${Number(r.valor).toFixed(2)}`; // mesma entrada lançada nos dois aparelhos
    const chaves = col === 'compras' ? new Set(db.compras.map(chaveCompra)) : col === 'receitas' ? new Set(db.receitas.map(chaveRec)) : null;
    const chave = col === 'compras' ? chaveCompra : chaveRec;
    const add = (outro[col] || []).filter(x => x && !ids.has(x.id) && !(chaves && chaves.has(chave(x))));
    db[col].push(...add); novos[col] = add.length;
  }
  for (const k of ['pagos', 'ajustes']) for (const [m, obj] of Object.entries(outro[k] || {})) db[k][m] = { ...obj, ...(db[k][m] || {}) };
  if (!db.reserva && outro.reserva) db.reserva = outro.reserva;
  return novos;
}
$('#juntarFile').onchange = async e => {

function processarJuntar(texto) {
  let d; try { d = lerJSON(texto); } catch { return toast('Esse texto não é um backup válido'); }
  if (ehArquivoDeFaturas(d)) return importarFaturas(d);
  if (!Array.isArray(d.receitas)) return toast('Esse arquivo não é um backup das finanças');
  const n = juntarDados(d);
  const total = Object.values(n).reduce((a, b) => a + b, 0);
  salvar();
  return avisar(total ? `Juntei ${total} lançamento(s) novo(s):\n• ${n.compras} compras no cartão\n• ${n.gastos} gastos\n• ${n.receitas} entradas\n• ${n.fixos} gastos fixos\n• ${n.cartoes} cartões` : 'Nada novo: este aparelho já tinha tudo desse arquivo.');
};

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab],[data-acao],[data-editar],[data-excluir],[data-encerrar],[data-ajustar],[data-virada],[data-visao]');
  if (!t) return;
  if (t.dataset.tab) { aba = t.dataset.tab; render(); window.scrollTo({ top: 0 }); return; }
  if (t.dataset.acao) return ACOES[t.dataset.acao]();
  if (t.dataset.editar) {
    const [col, id] = t.dataset.editar.split(':');
    if (col === 'receitas' && id.startsWith('rf_')) { const r = materializar(id); salvar(); return abrirForm('receitas', r); }
    return abrirForm(col, db[col].find(x => x.id === id));
  }
  if (t.dataset.visao) { visaoGastos = t.dataset.visao; try { localStorage.setItem('visao-gastos', visaoGastos); } catch (e) {} render(); return; }
  if (t.dataset.virada) {
    const c = cartaoPor(t.dataset.virada), fm = mesFechaDaFatura(c, mes), per = periodoFatura(c, mes);
    const r = await perguntar(`Fatura de ${nomeMes(mes)} do ${c.nome}: hoje vai de ${per.de} a ${per.ate}.\n\nQual é o "melhor dia de compra" (o dia em que ela vira) em ${nomeMes(fm)}? Veja no app do banco. Deixe vazio para voltar ao padrão (dia ${c.fechamento}).`, c.viradas?.[fm] ?? '', 'Período da fatura');
    if (r === null) return;
    const d = parseInt(r);
    c.viradas ||= {};
    if (!r.trim() || d === Number(c.fechamento)) delete c.viradas[fm];
    else if (d >= 1 && d <= 31) c.viradas[fm] = d; else return toast('Dia inválido');
    salvar(); const n = periodoFatura(c, mes); toast(`Fatura de ${nomeMes(mes).split(' ')[0]}: ${n.de} a ${n.ate}`); return;
  }
  if (t.dataset.ajustar) {
    const f = db.fixos.find(x => x.id === t.dataset.ajustar), atual = db.ajustes?.[mes]?.[f.id];
    const r = await perguntar(`Valor de "${f.nome}" só em ${nomeMes(mes)} (padrão ${brl(f.valor)}).\nDeixe vazio para voltar ao padrão.`, atual != null ? valorTxt(atual) : '', 'Valor deste mês');
    if (r === null) return;
    db.ajustes ||= {};
    if (r.trim() === '') { if (db.ajustes[mes]) delete db.ajustes[mes][f.id]; }
    else { const v = lerValor(r); if (isNaN(v) || v < 0) return toast('Valor inválido'); (db.ajustes[mes] ||= {})[f.id] = v; }
    salvar(); return;
  }
  if (t.dataset.encerrar) {
    const f = db.fixos.find(x => x.id === t.dataset.encerrar);
    if (await confirmar(`Encerrar "${f.nome}"? Ele deixa de aparecer a partir de ${nomeMes(mes)}, mas continua no histórico dos meses anteriores.`)) { f.fim = addM(mes, -1); salvar(); }
    return;
  }
  if (t.dataset.excluir) {
    const [col, id] = t.dataset.excluir.split(':');
    if (col === 'receitas' && id.startsWith('rf_')) {
      const f = db.entradasFixas.find(x => x.id === id.slice(3, -8));
      if (!await confirmar(`"${f.descricao}" não vai entrar em ${nomeMes(mes)}? (Nos outros meses continua aparecendo.)`, 'Não vai entrar')) return;
      (db.puladas[mes] ||= []).push(f.id); salvar(); return;
    }
    if (col === 'cartoes') {
      const n = db.compras.filter(c => c.cartaoId === id).length;
      if (!await confirmar(`Excluir este cartão${n ? ` e as ${n} compras lançadas nele` : ''}?`)) return;
      db.compras = db.compras.filter(c => c.cartaoId !== id);
      db.fixos.forEach(f => { if (f.forma === id) f.forma = 'boleto'; });
    } else if (col === 'fixos') {
      if (!await confirmar('Excluir este gasto fixo de TODOS os meses? (Para só parar daqui pra frente, use ⏹ Encerrar.)', 'Excluir')) return;
    } else if (!await confirmar('Excluir este lançamento?', 'Excluir')) return;
    db[col] = db[col].filter(x => x.id !== id);
    salvar();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pagar) { (db.pagos[mes] ||= {})[t.dataset.pagar] = t.checked; if (!t.checked) delete db.pagos[mes][t.dataset.pagar]; salvar(); }
  if (t.dataset.receber) { const r = t.dataset.receber.startsWith('rf_') ? materializar(t.dataset.receber) : db.receitas.find(x => x.id === t.dataset.receber); if (r) { r.status = t.checked ? 'recebido' : 'previsto'; salvar(); } }
});
$('#prev').onclick = () => { mes = addM(mes, -1); render(); };
$('#next').onclick = () => { mes = addM(mes, 1); render(); };

// Dados que vêm junto com a página (só na versão privada do celular). Aplicados uma única vez.
function aplicarSemente() {
  const sem = window.DADOS_INICIAIS;
  if (!sem || db.semente === sem.semente) return;
  const vazio = !db.receitas.length && !db.compras.length && !db.fixos.length && !db.gastos.length;
  if (vazio) db = Object.assign(VAZIO(), JSON.parse(JSON.stringify(sem)));
  else { // já tem lançamentos: atualiza os que vieram na página e soma os que faltam
    // se uma versão anterior já foi aplicada, só os cartões são atualizados (para não desfazer edições feitas no aparelho)
    for (const col of db.semente ? ['cartoes'] : ['receitas', 'fixos', 'cartoes', 'compras', 'gastos'])
      for (const x of sem[col] || []) { const i = db[col].findIndex(y => y.id === x.id); if (i >= 0) db[col][i] = JSON.parse(JSON.stringify(x)); }
    if (Array.isArray(sem.pessoas)) db.pessoas = [...sem.pessoas];
    // correções pontuais vindas da página (ex.: fatura conferida com o banco)
    // Um lançamento pode ter outra identificação interna em aparelhos que receberam versões antigas dos dados:
    // por isso também é reconhecido pelo conteúdo (cartão, data, descrição, parcelas).
    const mesmo = (x, y) => (x.cartaoId || '') === (y.cartaoId || '') && x.data === y.data && x.descricao === y.descricao && (Number(x.parcelas) || 1) === (Number(y.parcelas) || 1);
    const casa = (x, d) => typeof d === 'string' ? x.id === d : (x.cartaoId || '') === (d.cartaoId || '') && x.data === d.data && Math.abs(Number(x.valor) - Number(d.valor)) < 0.005;
    for (const [col, lista] of Object.entries(sem.remover || {})) db[col] = db[col].filter(x => !lista.some(d => casa(x, d)));
    for (const [col, ids] of Object.entries(sem.atualizar || {})) for (const id of ids) {
      const novo = (sem[col] || []).find(x => x.id === id); if (!novo) continue;
      const copia = JSON.parse(JSON.stringify(novo));
      let i = db[col].findIndex(x => x.id === id);
      if (i < 0 && col === 'compras') {
        const iguais = db[col].map((x, k) => [x, k]).filter(([x]) => mesmo(x, novo) && !ids.includes(x.id));
        const exato = iguais.find(([x]) => Math.abs(Number(x.valor) - Number(novo.valor)) < 0.005);
        i = exato ? exato[1] : iguais.length === 1 ? iguais[0][1] : -1;
      }
      if (i >= 0) db[col][i] = copia; else db[col].push(copia);
      // limpa cópias que versões anteriores possam ter deixado
      if (col === 'compras') db.compras = db.compras.filter(x => x === copia || x.id === id || ids.includes(x.id) || !mesmo(x, novo));
    }
    juntarDados(sem);
  }
  db.semente = sem.semente;
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}
}
document.querySelectorAll('.bnav [data-ic]').forEach(b => b.insertAdjacentHTML('afterbegin', ic(b.dataset.ic)));
aplicarSemente();
prepararPessoas();
render();
iniciarArquivo();
// App instalável (funciona sem internet) e pedido para o celular não apagar os dados
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
try { navigator.storage?.persist?.(); } catch (e) {}
